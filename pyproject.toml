[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-mcp"
version = "0.1.0"
description = "MCP service for OCR recognition powered by PaddleOCR"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "LinuxLinking" }]
keywords = ["mcp", "ocr", "paddleocr", "text-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mcp>=1.0.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/LinuxLinking/OCR_MCP"
Repository = "https://github.com/LinuxLinking/OCR_MCP"
Issues = "https://github.com/LinuxLinking/OCR_MCP/issues"

[project.scripts]
ocr-mcp = "ocr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_mcp"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
